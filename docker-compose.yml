# Local development: website on http://localhost:8000, database on localhost:3307
# Start:  docker compose up -d     Stop:  docker compose down
services:
  db:
    image: mariadb:10.4            # same version as the hosting server
    environment:
      MARIADB_ROOT_PASSWORD: root-local-only
      MARIADB_DATABASE: glw_local
      MARIADB_USER: glw_local
      MARIADB_PASSWORD: glw_local_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: ./docker/php
    depends_on: [db]
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      SITE_URL: http://localhost:8000
      DB_HOST: db
      DB_NAME: glw_local
      DB_USER: glw_local
      DB_PASS: glw_local_pass
      MIGRATE_TOKEN: local-only-token-not-a-secret-123456
    volumes:
      - ./src/public:/var/www/html          # web root (public_html on the server)
      - ./src/app:/var/www/app              # private app folder (next to the web root)
      - ./database/migrations:/var/www/app/migrations:ro
      - ./:/repo                            # for the scripts: docker compose exec web php /repo/scripts/migrate.php

volumes:
  db_data:
