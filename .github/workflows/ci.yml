# CI: runs on every pull request and on pushes to develop/main.
# Lint + database migrations + sample data + smoke test against a real MariaDB.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: glw_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: local
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: glw_ci
      DB_USER: root
      DB_PASS: root
      MIGRATE_TOKEN: ci-only-token-not-a-secret-1234567890
      SITE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, zlib

      - name: Lint PHP
        run: bash scripts/lint.sh

      - name: Run migrations (twice – must be safe to re-run)
        run: |
          php scripts/migrate.php
          php scripts/migrate.php

      - name: Load sample data and a test admin
        run: |
          php scripts/seed.php
          php scripts/create-admin.php ci-admin ci-password-123

      - name: Start the site
        run: |
          php -S 127.0.0.1:8000 -t src/public > /tmp/php.log 2>&1 &
          sleep 2

      - name: Smoke test
        run: BASE_URL=http://127.0.0.1:8000 bash tests/smoke.sh

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/php.log
