# Deploy by Git (pull-based – no FTP password needed):
#   merge to develop -> staging    (when the repo variable STAGING_DEPLOY_ENABLED = true)
#   merge to main    -> production (when the repo variable PRODUCTION_DEPLOY_ENABLED = true)
# GitHub only sends the server a signal with a secret token; the server itself downloads
# this exact commit from GitHub, installs it, backs up the database and runs migrations.
# See docs/deployment.md.
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.ref_name == 'main'    && vars.PRODUCTION_DEPLOY_ENABLED == 'true') ||
      (github.ref_name == 'develop' && vars.STAGING_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Ask the server to install this commit
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          body=$(printf '{"sha":"%s","branch":"%s"}' "${{ github.sha }}" "${{ github.ref_name }}")
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 300 -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$SITE_URL/deploy-hook.php")
          cat response.json; echo
          if [ "$code" = "409" ]; then echo "A newer commit is already on the branch – its own deploy will install it."; exit 0; fi
          [ "$code" = "200" ]

      - name: Check the live site answers
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          shops=$(curl -fsS "$SITE_URL/api.php?action=shops")
          grep -q '"ok":true' <<< "$shops"
          admin=$(curl -fsS "$SITE_URL/admin.php")
          grep -q 'Admin login' <<< "$admin"
          echo "Deployed site answers correctly."
